# rag-service Alembic 配置。
# 仅管 MySQL 多 schema（rag_shared/rag_trace/rag_doc/rag_agentic）；
# Neo4j 用 SchemaInitializer、ChromaDB 用 ChromaCollectionInitializer（均非 Alembic）。
# DB URL 由 alembic/env.py 从 RagSettings（RAG_MYSQL__DSN）注入，覆盖此处的占位。

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url = mysql+asyncmy://rag:rag@mysql:3306/rag

# 版本文件命名：4 位序号 + 描述，便于按顺序审阅。
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
