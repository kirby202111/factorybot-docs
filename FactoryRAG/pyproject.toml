[project]
name = "rag-service"
version = "0.1.0"
description = "rag-service: 单服务 + 共享内核承载 A(追溯型)/B(文档型)/E(Agentic) 三路线 RAG"
requires-python = ">=3.11"
readme = "README.md"

# 依赖收敛口径见《rag-service-技术选型和实现方案》§1.1/§1.3。
# 被 >=2 路线复用的依赖归 shared；仅单路线使用的依赖标 [route]。
dependencies = [
    # ── shared：Web / 部署 / 校验 / 配置 ──
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "gunicorn>=21.2",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",

    # ── shared：LLM 抽象 ──
    "langchain-core>=0.2",
    # provider 按需选装：langchain-anthropic / langchain-community(通义/DeepSeek) / 本地

    # ── shared：持久化 / 迁移（MySQL）──
    "sqlalchemy[asyncio]>=2.0",
    "asyncmy>=0.2.9",
    "alembic>=1.13",
    "redis>=5.0",

    # ── shared：消息 / HTTP / 可观测 ──
    "aiokafka>=0.10",
    "httpx>=0.27",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-instrumentation-httpx>=0.45b0",
    "prometheus-client>=0.20",
    "structlog>=24.1",

    # ── shared：embedding（bge 本地化推理）──
    "sentence-transformers>=3.0",
    "FlagEmbedding>=1.2",

    # ── A 追溯型 ──
    "neo4j[async]>=5.20",            # [A]
    "llama-index>=0.10",             # [A/B]

    # ── B 文档型 ──
    "chromadb>=0.5",                 # [B] 嵌入式向量库
    "llama-index-vector-stores-chroma>=0.2",  # [B]
    "minio>=7.2",                    # [B] 原始文档对象存储
    "unstructured>=0.14",            # [B] 文档解析
    "pypdf>=4.0",                    # [B]
    "python-docx>=1.1",              # [B]

    # ── E Agentic ──
    "langgraph>=0.2",                # [E] 统一口径（Command(resume=…) 语义依赖）
]

# dev 工具组（PEP 735）。`uv sync` 默认安装 dev 组。
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "anyio>=4.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# ── uv 索引镜像（国内下载加速）──
# default=true 替换默认 PyPI；如需容灾可再追加一条不带 default 的镜像源。
[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
