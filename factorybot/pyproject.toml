[project]
name = "factorybot"
version = "0.1.0"
description = "MES Agent 服务 (L1 诊断 / L2 草稿 / L3 编排) — LangGraph + FastAPI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "langgraph>=0.2.40",
    "langchain-core>=0.2",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.24",
]

[project.optional-dependencies]
# 真实外部依赖：默认不需要，mock 模式下全部可省略
mysql = ["SQLAlchemy>=2.0", "asyncmy>=0.2", "langgraph-checkpoint-mysql"]
redis = ["redis>=5.0"]
llm = ["langchain-openai>=0.1", "langchain-anthropic>=0.1"]
otel = ["opentelemetry-sdk>=1.24", "opentelemetry-exporter-otlp>=1.24"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "anyio>=4.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
